<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cubo.css">
    <title>Cubo 3D Interativo</title>
</head>
<body>
    <main>
        <h1>Cubo 3D Interativo</h1>
        <p>HTML, CSS e JavaScript</p>
        <div class="cenario" id="cenario">
            <div class="cubo" id="cubo">
                <div class="face front">1</div>
                <div class="face back">2</div>
                <div class="face right">3</div>
                <div class="face left">4</div>
                <div class="face top">5</div>    
                <div class="face bottom">6</div>
            </div>
        </div>
        <div class="controles" id="controles"></div>
            <button class="botoes" id="pausa">Parar</button>
            <button class="botoes" id="mais">Aumentar</button>
            <button class="botoes" id="menos">Diminuir</button>
            <button class="botoes" id="normal">Normal</button>
            <button class="botoes" id="rapido">Rápido</button>
            <button class="botoes" id="lento">Lento</button>
            <button class="botoes"  id="reset">Reiniciar</button>
        </div>
    </main>
    <script src="cubo.js"></script>
</body>
</html>
